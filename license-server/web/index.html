<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZL · 激活码管理后台</title><link rel="stylesheet" href="/admin.css"></head><body><header><b>ZL</b><span>授权管理中心</span><small>激活码 · 设备绑定 · 使用记录</small><button id="logout" hidden>退出登录</button></header><main><section id="login" class="login card"><p class="eyebrow">ZL MULTI MANAGER</p><h1>激活码管理后台</h1><p class="muted">使用部署时设置的管理员密码登录。</p><form id="loginForm"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required minlength="12"><button class="primary">登录后台</button></form></section><section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">LICENSE CONTROL</p><h1>激活码管理</h1><p class="muted">一枚激活码，一台设备。有效期从首次激活开始计算。</p></div><button id="refresh">刷新记录</button></div><div id="metrics" class="metrics"></div><section class="card"><h2>生成激活码</h2><form id="generateForm" class="generation"><label>生成数量<input id="count" type="number" value="1" min="1" max="100" required></label><label>有效期限<select id="duration"><option value="0">永久有效</option><option value="30">30 天</option><option value="90">90 天</option><option value="365">1 年（365 天）</option></select></label><label class="stretch">客户 / 批次备注<input id="label" maxlength="120" placeholder="例如：客户名称或销售批次"></label><button class="primary">生成激活码</button></form></section><section id="newCodes" class="card" hidden><div class="heading"><h2>本次生成的激活码</h2><button id="download">下载本批 CSV</button></div><p class="muted">完整激活码仅在本次生成后显示。请先下载保存；后台仅保存哈希及末 4 位，刷新后无法找回完整码。</p><pre id="codes"></pre><button id="clearCodes">已保存，隐藏完整码</button></section><section class="card"><div class="heading"><h2>使用情况 <span id="countLabel"></span></h2><div class="filters"><input id="search" placeholder="搜索备注、编号、末 4 位或设备" aria-label="搜索激活码"><select id="status" aria-label="筛选状态"><option value="all">全部状态</option><option value="unused">未使用</option><option value="active">已激活</option><option value="disabled">已停用</option><option value="expired">已过期</option></select></div></div><div class="table-wrap"><table><thead><tr><th>激活码 / 编号</th><th>客户备注</th><th>状态</th><th>绑定设备</th><th>激活 / 到期时间</th><th>最近验证</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">仅显示实际服务端记录；首次激活和每 6 小时复检更新使用情况。停用不会解除设备绑定。</p></section></section><p id="feedback" role="status"></p></main><dialog id="logs"><div class="heading"><h2>授权使用日志</h2><button id="closeLogs" aria-label="关闭日志">×</button></div><div id="logRows"></div></dialog><script src="/admin.js"></script></body></html>
