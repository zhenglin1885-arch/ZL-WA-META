name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm test
      - run: npm ci --prefix desktop
      - run: npm run dist:win --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check installer and checksum
        shell: pwsh
        run: |
          $file = 'desktop/release/ZL-Multi-Manager-Setup.exe'
          if (!(Test-Path $file)) { throw 'Installer missing' }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  ZL-Multi-Manager-Setup.exe" | Set-Content desktop/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-Windows-installer
          path: |
            desktop/release/ZL-Multi-Manager-Setup.exe
            desktop/release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" desktop/release/ZL-Multi-Manager-Setup.exe desktop/release/SHA256SUMS.txt --title "ZL Multi Manager $env:RELEASE_TAG" --notes-file desktop/RELEASE-NOTES.md --latest
